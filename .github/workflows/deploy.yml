name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SocOps/SocOps.csproj

      - name: Build
        run: dotnet publish SocOps/SocOps.csproj -c Release -o release --nologo

      - name: Prepare deployment
        run: |
          # Fix base href for GitHub Pages
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|g' release/wwwroot/index.html

          # Copy index.html as 404.html for SPA routing on refresh
          cp release/wwwroot/index.html release/wwwroot/404.html

          # Prevent Jekyll processing (so _framework dir is served)
          touch release/wwwroot/.nojekyll

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
